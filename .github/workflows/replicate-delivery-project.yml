name: Replicate Delivery - Dev & SGI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/replicate-delivery-project.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replicate:
    name: Replicate Delivery - Dev & SGI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate source GitHub App token
        id: source-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.PROJECTS_APP_ID }}
          private-key: ${{ secrets.PROJECTS_APP_PRIVATE_KEY }}
          owner: OS-Sistemas

      - name: Generate target GitHub App token
        id: target-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.PROJECTS_APP_ID }}
          private-key: ${{ secrets.PROJECTS_APP_PRIVATE_KEY }}
          owner: ourosafra

      - name: Replicate project
        shell: bash
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          TARGET_TOKEN: ${{ steps.target-token.outputs.token }}
        run: |
          set -euo pipefail

          SOURCE_ORG="OS-Sistemas"
          TARGET_ORG="ourosafra"
          SOURCE_PROJECT_NUMBER=17
          PROJECT_TITLE="Delivery - Dev & SGI"

          graphql() {
            local token="$1"
            local query="$2"
            local variables="$3"

            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              https://api.github.com/graphql \
              -d "$(jq -n --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          }

          source_query='query($login:String!,$number:Int!){organization(login:$login){projectV2(number:$number){id number title shortDescription readme public fields(first:100){nodes{... on ProjectV2FieldCommon{id name dataType} ... on ProjectV2SingleSelectField{id name dataType options{id name description color}}}}}}}'
          source_json=$(graphql "$SOURCE_TOKEN" "$source_query" "$(jq -n --arg login "$SOURCE_ORG" --argjson number "$SOURCE_PROJECT_NUMBER" '{login:$login,number:$number}')")

          if [ "$(echo "$source_json" | jq -r '.errors // empty')" != "" ]; then
            echo "$source_json" | jq .
            exit 1
          fi

          source_id=$(echo "$source_json" | jq -r '.data.organization.projectV2.id')
          if [ -z "$source_id" ] || [ "$source_id" = "null" ]; then
            echo "Source project #${SOURCE_PROJECT_NUMBER} not found."
            exit 1
          fi

          echo "Source: $(echo "$source_json" | jq -r '.data.organization.projectV2.title') (#${SOURCE_PROJECT_NUMBER})"

          target_query='query($login:String!){organization(login:$login){id projectsV2(first:100){nodes{id number title}}}}'
          target_json=$(graphql "$TARGET_TOKEN" "$target_query" "$(jq -n --arg login "$TARGET_ORG" '{login:$login}')")

          if [ "$(echo "$target_json" | jq -r '.errors // empty')" != "" ]; then
            echo "$target_json" | jq .
            exit 1
          fi

          target_owner_id=$(echo "$target_json" | jq -r '.data.organization.id')
          existing_number=$(echo "$target_json" | jq -r --arg title "$PROJECT_TITLE" '.data.organization.projectsV2.nodes[] | select(.title == $title) | .number' | head -n1)

          if [ -n "$existing_number" ]; then
            echo "Project already exists: https://github.com/orgs/${TARGET_ORG}/projects/${existing_number}"
            exit 0
          fi

          create_mutation='mutation($ownerId:ID!,$title:String!){createProjectV2(input:{ownerId:$ownerId,title:$title}){projectV2{id number title}}}'
          create_json=$(graphql "$TARGET_TOKEN" "$create_mutation" "$(jq -n --arg ownerId "$target_owner_id" --arg title "$PROJECT_TITLE" '{ownerId:$ownerId,title:$title}')")

          if [ "$(echo "$create_json" | jq -r '.errors // empty')" != "" ]; then
            echo "$create_json" | jq .
            exit 1
          fi

          target_project_id=$(echo "$create_json" | jq -r '.data.createProjectV2.projectV2.id')
          target_project_number=$(echo "$create_json" | jq -r '.data.createProjectV2.projectV2.number')

          update_mutation='mutation($projectId:ID!,$shortDescription:String,$readme:String,$public:Boolean!){updateProjectV2(input:{projectId:$projectId,shortDescription:$shortDescription,readme:$readme,public:$public}){projectV2{id}}}'
          update_vars=$(echo "$source_json" | jq -c --arg projectId "$target_project_id" '{projectId:$projectId,shortDescription:(.data.organization.projectV2.shortDescription // ""),readme:(.data.organization.projectV2.readme // ""),public:(.data.organization.projectV2.public // false)}')
          update_json=$(graphql "$TARGET_TOKEN" "$update_mutation" "$update_vars")

          if [ "$(echo "$update_json" | jq -r '.errors // empty')" != "" ]; then
            echo "$update_json" | jq .
            exit 1
          fi

          echo "$source_json" | jq -c '.data.organization.projectV2.fields.nodes[] | select(.name != "Title" and .name != "Assignees" and .name != "Labels" and .name != "Milestone" and .name != "Repository" and .name != "Reviewers" and .name != "Linked pull requests" and .name != "Tracks" and .name != "Tracked by")' | while read -r field; do
            field_name=$(echo "$field" | jq -r '.name')
            data_type=$(echo "$field" | jq -r '.dataType')

            case "$data_type" in
              TEXT|NUMBER|DATE)
                mutation='mutation($projectId:ID!,$name:String!,$dataType:ProjectV2CustomFieldType!){createProjectV2Field(input:{projectId:$projectId,name:$name,dataType:$dataType}){projectV2Field{id}}}'
                vars=$(jq -n --arg projectId "$target_project_id" --arg name "$field_name" --arg dataType "$data_type" '{projectId:$projectId,name:$name,dataType:$dataType}')
                result=$(graphql "$TARGET_TOKEN" "$mutation" "$vars")
                ;;
              SINGLE_SELECT)
                options=$(echo "$field" | jq -c '[.options[] | {name,description,color}]')
                mutation='mutation($projectId:ID!,$name:String!,$options:[ProjectV2SingleSelectFieldOptionInput!]!){createProjectV2Field(input:{projectId:$projectId,name:$name,dataType:SINGLE_SELECT,singleSelectOptions:$options}){projectV2Field{id}}}'
                vars=$(jq -n --arg projectId "$target_project_id" --arg name "$field_name" --argjson options "$options" '{projectId:$projectId,name:$name,options:$options}')
                result=$(graphql "$TARGET_TOKEN" "$mutation" "$vars")
                ;;
              *)
                echo "Skipping unsupported field '${field_name}' (${data_type})."
                continue
                ;;
            esac

            if [ "$(echo "$result" | jq -r '.errors // empty')" != "" ]; then
              echo "$result" | jq .
              exit 1
            fi

            echo "Created field: ${field_name} (${data_type})"
          done

          echo "Replication completed."
          echo "Project URL: https://github.com/orgs/${TARGET_ORG}/projects/${target_project_number}"
