name: Sync issue governance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-issue-governance.yml'
      - '.github/ISSUE_TEMPLATE/*.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Generate Ouro Safra GitHub App token
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: 4731476
          private-key: ${{ secrets.PROJECTS_APP_PRIVATE_KEY }}
          owner: ourosafra

      - name: Synchronize issue types and Team field
        shell: bash
        env:
          GH_APP_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const token = process.env.GH_APP_TOKEN;
          const org = 'ourosafra';
          const apiVersion = '2026-03-10';
          const result = {
            generatedAt: new Date().toISOString(),
            issueTypes: { created: [], existing: [], errors: [] },
            issueFields: { created: [], existing: [], errors: [], warnings: [] },
          };

          async function request(endpoint, options = {}) {
            const response = await fetch(`https://api.github.com${endpoint}`, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': apiVersion,
                'Content-Type': 'application/json',
                ...(options.headers || {}),
              },
            });
            const text = await response.text();
            let data = null;
            if (text) {
              try { data = JSON.parse(text); } catch { data = text; }
            }
            if (!response.ok) {
              throw new Error(`${response.status} ${endpoint}: ${JSON.stringify(data)}`);
            }
            return data;
          }

          function readForms() {
            const dir = '.github/ISSUE_TEMPLATE';
            return fs.readdirSync(dir)
              .filter(file => file.endsWith('.yml'))
              .map(file => {
                const content = fs.readFileSync(path.join(dir, file), 'utf8');
                const type = content.match(/^type:\s*(.+)$/m)?.[1]?.trim();
                const description = content.match(/^description:\s*(.+)$/m)?.[1]?.trim() || null;
                return { file, type, description };
              })
              .filter(item => item.type);
          }

          try {
            const existingTypes = await request(`/orgs/${org}/issue-types`);
            const byName = new Map(existingTypes.map(item => [item.name.toLowerCase(), item]));
            for (const form of readForms()) {
              if (byName.has(form.type.toLowerCase())) {
                result.issueTypes.existing.push(form.type);
                continue;
              }
              try {
                const created = await request(`/orgs/${org}/issue-types`, {
                  method: 'POST',
                  body: JSON.stringify({
                    name: form.type,
                    description: form.description,
                    is_enabled: true,
                    color: null,
                  }),
                });
                result.issueTypes.created.push({ name: created.name, id: created.id });
                byName.set(created.name.toLowerCase(), created);
              } catch (error) {
                result.issueTypes.errors.push({ name: form.type, error: String(error.message || error) });
              }
            }
          } catch (error) {
            result.issueTypes.errors.push({ scope: 'list', error: String(error.message || error) });
          }

          try {
            const fields = await request(`/orgs/${org}/issue-fields`);
            const team = fields.find(field => field.name.toLowerCase() === 'team');
            if (team) {
              result.issueFields.existing.push({ name: team.name, id: team.id });
            } else {
              const options = ['VX 360', 'RPA', 'SGI', 'Dados'].map((name, index) => ({
                name,
                description: null,
                color: 'gray',
                priority: index + 1,
              }));
              const created = await request(`/orgs/${org}/issue-fields`, {
                method: 'POST',
                body: JSON.stringify({
                  name: 'Team',
                  description: 'Equipe responsável pela demanda.',
                  data_type: 'single_select',
                  visibility: 'all',
                  options,
                }),
              });
              result.issueFields.created.push({ name: created.name, id: created.id });
              result.issueFields.warnings.push('As cores das opções de Team não puderam ser lidas do OS-Sistemas; foram criadas como gray sem alterar os nomes das opções.');
            }
          } catch (error) {
            result.issueFields.errors.push({ scope: 'Team', error: String(error.message || error) });
          }

          fs.mkdirSync('.github/governance', { recursive: true });
          fs.writeFileSync('.github/governance/issue-governance-result.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));

          if (result.issueTypes.errors.length || result.issueFields.errors.length) {
            process.exitCode = 1;
          }
          NODE

      - name: Commit synchronization result
        if: always()
        shell: bash
        run: |
          if [ ! -f .github/governance/issue-governance-result.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/governance/issue-governance-result.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record issue governance synchronization"
          git push
