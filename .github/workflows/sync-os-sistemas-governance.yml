name: Migrate OS-Sistemas governance

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-os-sistemas-governance.yml'
      - '.github/governance/projects-source.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Generate Ouro Safra GitHub App token
        id: target-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: 4731476
          private-key: ${{ secrets.PROJECTS_APP_PRIVATE_KEY }}
          owner: ourosafra

      - name: Recreate organization Projects
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.target-token.outputs.token }}
        run: |
          node <<'NODE'
          import fs from 'node:fs';

          const TARGET_ORG = 'ourosafra';
          const API_VERSION = '2026-03-10';
          const token = process.env.TARGET_TOKEN;
          const manifest = JSON.parse(
            fs.readFileSync('.github/governance/projects-source.json', 'utf8'),
          );

          const result = {
            generatedAt: new Date().toISOString(),
            sourceOrganization: manifest.sourceOrganization,
            targetOrganization: TARGET_ORG,
            projects: { created: [], updated: [], errors: [], warnings: [] },
          };

          async function request(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': API_VERSION,
                'Content-Type': 'application/json',
                ...(options.headers || {}),
              },
            });

            const text = await response.text();
            let data = null;
            if (text) {
              try { data = JSON.parse(text); } catch { data = text; }
            }

            if (!response.ok) {
              throw new Error(`${response.status} ${url}: ${JSON.stringify(data)}`);
            }

            return data;
          }

          async function graphql(query, variables = {}) {
            const payload = await request('https://api.github.com/graphql', {
              method: 'POST',
              body: JSON.stringify({ query, variables }),
            });

            if (payload.errors?.length) {
              throw new Error(JSON.stringify(payload.errors));
            }

            return payload.data;
          }

          async function getOrganization() {
            return graphql(`
              query Organization($login: String!) {
                organization(login: $login) {
                  id
                  projectsV2(first: 100) {
                    nodes { id number title }
                  }
                }
              }
            `, { login: TARGET_ORG });
          }

          async function getProject(projectId) {
            const data = await graphql(`
              query Project($id: ID!) {
                node(id: $id) {
                  ... on ProjectV2 {
                    id
                    number
                    title
                    fields(first: 100) {
                      nodes {
                        __typename
                        ... on ProjectV2Field { id name dataType }
                        ... on ProjectV2SingleSelectField { id name dataType }
                        ... on ProjectV2MultiSelectField { id name dataType }
                        ... on ProjectV2IterationField { id name dataType }
                      }
                    }
                    views(first: 100) {
                      nodes { id name layout filter }
                    }
                  }
                }
              }
            `, { id: projectId });
            return data.node;
          }

          async function createField(projectId, field) {
            const input = {
              projectId,
              name: field.name,
              dataType: field.dataType,
            };

            if (field.dataType === 'SINGLE_SELECT' && field.options?.length) {
              input.singleSelectOptions = field.options.map(option => ({
                name: option.name,
                description: option.description || '',
                color: option.color,
              }));
            }

            const data = await graphql(`
              mutation CreateField($input: CreateProjectV2FieldInput!) {
                createProjectV2Field(input: $input) {
                  projectV2Field {
                    ... on ProjectV2Field { id name }
                    ... on ProjectV2SingleSelectField { id name }
                    ... on ProjectV2MultiSelectField { id name }
                    ... on ProjectV2IterationField { id name }
                  }
                }
              }
            `, { input });

            return data.createProjectV2Field.projectV2Field;
          }

          const organization = (await getOrganization()).organization;
          const targetByTitle = new Map(
            organization.projectsV2.nodes.map(project => [project.title, project]),
          );

          for (const source of manifest.projects) {
            try {
              let target = targetByTitle.get(source.title);
              let created = false;

              if (!target) {
                const createData = await graphql(`
                  mutation CreateProject($ownerId: ID!, $title: String!) {
                    createProjectV2(input: { ownerId: $ownerId, title: $title }) {
                      projectV2 { id number title }
                    }
                  }
                `, {
                  ownerId: organization.id,
                  title: source.title,
                });

                target = createData.createProjectV2.projectV2;
                targetByTitle.set(target.title, target);
                created = true;
                result.projects.created.push({
                  sourceNumber: source.number,
                  targetNumber: target.number,
                  title: target.title,
                });
              }

              await graphql(`
                mutation UpdateProject($input: UpdateProjectV2Input!) {
                  updateProjectV2(input: $input) {
                    projectV2 { id }
                  }
                }
              `, {
                input: {
                  projectId: target.id,
                  shortDescription: source.shortDescription || '',
                  readme: source.readme || '',
                  closed: Boolean(source.closed),
                },
              });

              let detail = await getProject(target.id);
              let fieldByName = new Map(
                (detail.fields?.nodes || [])
                  .filter(Boolean)
                  .map(field => [field.name, field]),
              );

              for (const field of source.fields || []) {
                if (fieldByName.has(field.name)) continue;

                try {
                  if (!['TEXT', 'NUMBER', 'DATE', 'SINGLE_SELECT'].includes(field.dataType)) {
                    throw new Error(`Unsupported automatic field type: ${field.dataType}`);
                  }

                  await createField(target.id, field);
                } catch (error) {
                  result.projects.warnings.push({
                    project: source.title,
                    field: field.name,
                    error: String(error.message || error),
                  });
                }
              }

              detail = await getProject(target.id);
              fieldByName = new Map(
                (detail.fields?.nodes || [])
                  .filter(Boolean)
                  .map(field => [field.name, field]),
              );
              const viewByName = new Map(
                (detail.views?.nodes || []).map(view => [view.name, view]),
              );

              for (const sourceView of source.views || []) {
                const visibleFieldIds = (sourceView.fields || [])
                  .map(name => fieldByName.get(name)?.id)
                  .filter(Boolean);

                try {
                  let targetView = viewByName.get(sourceView.name);

                  if (!targetView) {
                    const viewData = await graphql(`
                      mutation CreateView($input: CreateProjectV2ViewInput!) {
                        createProjectV2View(input: $input) {
                          projectV2View { id name }
                        }
                      }
                    `, {
                      input: {
                        projectId: target.id,
                        name: sourceView.name,
                        layout: sourceView.layout,
                        configuration: { visibleFieldIds },
                      },
                    });
                    targetView = viewData.createProjectV2View.projectV2View;
                    viewByName.set(targetView.name, targetView);
                  }

                  await graphql(`
                    mutation UpdateView($input: UpdateProjectV2ViewInput!) {
                      updateProjectV2View(input: $input) {
                        projectV2View { id }
                      }
                    }
                  `, {
                    input: {
                      viewId: targetView.id,
                      name: sourceView.name,
                      layout: sourceView.layout,
                      filter: sourceView.filter || '',
                      configuration: { visibleFieldIds },
                    },
                  });
                } catch (error) {
                  result.projects.warnings.push({
                    project: source.title,
                    view: sourceView.name,
                    error: String(error.message || error),
                  });
                }
              }

              if (source.title.startsWith('[TEMPLATE]')) {
                try {
                  await graphql(`
                    mutation MarkTemplate($projectId: ID!) {
                      markProjectV2AsTemplate(input: { projectId: $projectId }) {
                        projectV2 { id }
                      }
                    }
                  `, { projectId: target.id });
                } catch (error) {
                  result.projects.warnings.push({
                    project: source.title,
                    operation: 'mark-template',
                    error: String(error.message || error),
                  });
                }
              }

              if (!created) {
                result.projects.updated.push({
                  sourceNumber: source.number,
                  targetNumber: target.number,
                  title: target.title,
                });
              }
            } catch (error) {
              result.projects.errors.push({
                project: source.title,
                error: String(error.message || error),
              });
            }
          }

          fs.writeFileSync(
            'governance-sync-result.json',
            JSON.stringify(result, null, 2) + '\n',
          );
          console.log(JSON.stringify(result, null, 2));

          if (result.projects.errors.length) {
            process.exitCode = 1;
          }
          NODE

      - name: Commit synchronization result
        if: always()
        shell: bash
        run: |
          if [ ! -f governance-sync-result.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance-sync-result.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record governance migration result"
          git push

      - name: Upload synchronization result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-sync-result
          path: governance-sync-result.json
          if-no-files-found: warn
