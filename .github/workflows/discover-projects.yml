name: Discover current Projects

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-projects.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Generate Ouro Safra GitHub App token
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: 4731476
          private-key: ${{ secrets.PROJECTS_APP_PRIVATE_KEY }}
          owner: ourosafra

      - name: Discover Projects
        env:
          GH_APP_TOKEN: ${{ steps.token.outputs.token }}
        shell: bash
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const response = await fetch('https://api.github.com/graphql', {
            method: 'POST',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GH_APP_TOKEN}`,
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2026-03-10',
            },
            body: JSON.stringify({
              query: `query($login:String!){organization(login:$login){projectsV2(first:100){nodes{number title closed}}}}`,
              variables: { login: 'ourosafra' },
            }),
          });
          const payload = await response.json();
          if (!response.ok || payload.errors?.length) throw new Error(JSON.stringify(payload.errors || payload));
          const projects = payload.data.organization.projectsV2.nodes.sort((a,b) => a.number - b.number);
          fs.mkdirSync('.github/governance', { recursive: true });
          fs.writeFileSync('.github/governance/project-index.json', JSON.stringify(projects, null, 2) + '\n');
          console.log(JSON.stringify(projects, null, 2));
          NODE

      - name: Commit Project index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/governance/project-index.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record current organization Projects"
          git push
